version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: neo4j_db
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt protocol for drivers
    environment:
      - NEO4J_AUTH=neo4j/your_secure_password
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379" # Redis port
    volumes:
      - redis_data:/data

volumes:
  neo4j_data:
  redis_data: